version: "1.0.0"

# ── Environment Identity ───────────────────────────────────────────────────────
name: DataCleaningEnv
display_name: "Intelligent Data Cleaning OpenEnv"
description: >
  A production-ready OpenEnv-compatible environment where an AI agent learns to
  clean and preprocess datasets through sequential decision-making. The agent
  observes dataset statistics (missing values, duplicates, data types) and
  applies targeted cleaning actions to maximise a deterministic quality score.

# ── Authorship ─────────────────────────────────────────────────────────────────
author: "OpenEnv Hackathon Team"
license: "MIT"
tags:
  - data-cleaning
  - tabular
  - reinforcement-learning
  - openenv
  - pytorch
  - hackathon

# ── API / Entrypoint ───────────────────────────────────────────────────────────
entrypoint: "uvicorn api.main:app --host 0.0.0.0 --port 8000"
api_base: "http://localhost:8000"
endpoints:
  tasks:   GET  /tasks
  reset:   POST /env/reset?task_name={task}
  step:    POST /env/step/{session_id}
  state:   GET  /env/state/{session_id}
  grader:  GET  /grader/{session_id}
  baseline: POST /baseline?task_name={task}

# ── Spaces ────────────────────────────────────────────────────────────────────
observation_space: models.schemas.Observation
action_space: models.schemas.Action

# ── Tasks ─────────────────────────────────────────────────────────────────────
tasks:
  - name: easy
    description: "Dataset with missing values only. Goal: fill or remove nulls."
    max_steps: 20
  - name: medium
    description: "Dataset with missing values + duplicate rows. Goal: clean both efficiently."
    max_steps: 20
  - name: hard
    description: "Dataset with nulls, duplicates, wrong data types, and format inconsistencies."
    max_steps: 20

# ── Reward Design ─────────────────────────────────────────────────────────────
reward:
  issue_fixed: +1.0        # per missing/duplicate issue resolved
  issue_introduced: -1.0   # per issue worsened
  unnecessary_step: -0.05  # small penalty per redundant action
  invalid_action: -0.1     # bad action parameters
  action_failure: -1.0     # exception during action execution
  score_range: [0.0, 1.0]  # final deterministic grader range

# ── Actions ───────────────────────────────────────────────────────────────────
actions:
  - remove_nulls
  - fill_missing_values
  - drop_duplicates
  - normalize_column
  - correct_data_type
  - no_op

# ── Infrastructure ────────────────────────────────────────────────────────────
runtime:
  python: "3.11"
  backend_framework: "FastAPI 0.109"
  frontend_framework: "React 18 + Vite"
docker:
  compose: docker-compose.yml
  backend_dockerfile: backend/Dockerfile
  frontend_dockerfile: frontend/Dockerfile
